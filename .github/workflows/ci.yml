name: ci

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Renovate config
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict .github/renovate.json
      - name: ShellCheck
        run: .github/scripts/lint-shell
      - name: E2E harness unit tests
        run: e2e/tests/harness-test.sh

  # Each platform builds natively on its own runner, so arm64 needs no QEMU.
  image:
    needs: lint
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          target: profile
          load: true
          tags: argus-profile:smoke-${{ matrix.arch }}
      - name: Version smoke
        run: .github/scripts/smoke-versions argus-profile:smoke-${{ matrix.arch }} ${{ matrix.platform }}
      - name: Runtime smoke
        run: .github/scripts/smoke-runtime argus-profile:smoke-${{ matrix.arch }}
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reuses the builder's cache from the build above. The merge job tags
      # the pushed digests as one multi-platform image.
      - name: Push by digest
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          target: profile
          outputs: type=image,name=ghcr.io/${{ github.repository }}/profile,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Push :main
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:main" "${refs[@]}"
        env:
          IMAGE: ghcr.io/${{ github.repository }}/profile
