name: ci

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Renovate config
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict .github/renovate.json
      - name: ShellCheck
        run: .github/scripts/lint-shell
      - name: E2E harness unit tests
        run: e2e/tests/harness-test.sh

  image:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image and two single-arch copies of it do not fit the runner's
      # default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          target: profile
          load: true
          tags: argus-profile:smoke-amd64
      - name: Build linux/arm64
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          target: profile
          load: true
          tags: argus-profile:smoke-arm64
      - name: Version smoke (linux/amd64)
        run: .github/scripts/smoke-versions argus-profile:smoke-amd64 linux/amd64
      - name: Version smoke (linux/arm64)
        run: .github/scripts/smoke-versions argus-profile:smoke-arm64 linux/arm64
      - name: Runtime smoke (linux/amd64)
        run: .github/scripts/smoke-runtime argus-profile:smoke-amd64
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reuses the builder's cache from the two builds above.
      - name: Push :main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          target: profile
          push: true
          tags: ghcr.io/${{ github.repository }}/profile:main
