[program:tailscaled]
command=/opt/argus/bin/tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock
autostart=true
autorestart=true
priority=10
stdout_logfile=/opt/argus/share/supervisor/tailscaled.log
stderr_logfile=/opt/argus/share/supervisor/tailscaled.log
